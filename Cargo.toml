[package]
name = "pulteqfx"
version = "0.13.0"
edition = "2021"
authors = ["Simon Huber <huber.simon@protonmail.com>"]
license = "GPL-3.0-or-later"
description = "PultEQFx, a circuit modelled passive program equalizer (CLAP/VST3/AU)"

[workspace]
members = ["assetgen", "installer", "xtask", "vendor/nice-plug-au2"]
exclude = ["vendor/baseview", "vendor/vizia", "vendor/vizia_plug"]

# One audited backend shared by the editor and its adapter.
[patch.crates-io]
baseview = { path = "vendor/baseview" }

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pulteqfx"
required-features = ["standalone"]

[features]
# The standalone host is only for trying the plugin outside a DAW.
default = []
standalone = ["nice-plug/standalone"]

[dependencies]
# nih-plug flushed denormals around `process` unconditionally; nice-plug only
# does with this feature, and the network's capacitor state decays into them.
nice-plug = { git = "https://codeberg.org/RustAudio/nice-plug", rev = "e60b5db09d8606c3dc3e93f982847a00bce17325", features = ["unsafe_flush_denormals"] }
vizia_plug = { path = "vendor/vizia_plug" }

# For reading and writing preset files.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# AUv2 is a macOS-only plugin format. Keeping this target-specific prevents
# CoreAudio/AppKit dependencies from entering Linux and Windows builds.
[target.'cfg(target_os = "macos")'.dependencies]
nice-plug-au2 = { path = "vendor/nice-plug-au2" }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
